<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <img class="preview" 
     alt="Styling with a Cool Cap" 
     src="coolcap.jpg.webp" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="With a Cute Dog" 
     src="cutedog.jpg.webp" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="drivingcar.jpg.webp" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

</body>
</html>
