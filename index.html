<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <img class="preview" 
     alt="Styling with a Cool Cap" 
     src="coolcap.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="With a Cute Dog" 
     src="cutedog.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="https://th.bing.com/th/id/OIP.H7hU26homZbdZhv1muY4AwHaE8?w=231&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

</body>
</html>
