<html lang="en">
<head>

  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.

  <img class="preview" 
       alt="Styling with a Cool Cap"

       onmouseleave="undo()">

  <img class="preview" 
       alt="With a Cute Dog" 
       src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388653/img2.jpg" 
       onmouseover="upDate(this)" 
       onmouseleave="undo()">

  <img class="preview" 
       alt="Young Life and Driving" 
       src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388653/img3.jpg" 
       onmouseover="upDate(this)" 
       onmouseleave="undo()">

</html>
