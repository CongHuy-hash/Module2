<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <img class="preview" 
     alt="Styling with a Cool Cap" 
     src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Baseball_cap.jpg/400px-Baseball_cap.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="With a Cute Dog" 
     src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/American_Eskimo_Dog.jpg/400px-American_Eskimo_Dog.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/2015_Ford_Mustang_GT_5.0_Front.jpg/400px-2015_Ford_Mustang_GT_5.0_Front.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

</body>
</html>
