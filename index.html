<!DOCTYPE html>
<html lang="en">
<head>

  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div id="image">
    Hover over an image below to display here.

     alt="With a Cute Dog" 
     src="https://www.bing.com/th/id/OIP.d7bB0-Rp5lAwm_ElXyQ0qQHaNK?w=193&h=333&c=8&rs=1&qlt=90&o=6&dpr=1.5&pid=ImgAns&rm=2"

     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="https://th.bing.com/th/id/OIP.H7hU26homZbdZhv1muY4AwHaE8?w=231&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3"

</html>
