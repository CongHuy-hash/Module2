<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <img class="preview" 
     alt="Styling with a Cool Cap" 
     src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" 
     onmouseover="upDate(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="With a Cute Dog" 
     src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" 
     onmouseover="upDate(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=500" 
     onmouseover="upDate(this)" 
     onmouseleave="undo()">

</body>
</html>
