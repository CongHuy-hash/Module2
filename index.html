<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js"></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <img class="preview" 
     alt="Styling with a Cool Cap" 
     src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388670/cap.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="With a Cute Dog" 
     src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388670/dog.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

<img class="preview" 
     alt="Young Life and Driving" 
     src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/388670/countryside.jpg" 
     onmouseover="update(this)" 
     onmouseleave="undo()">

</body>
</html>
